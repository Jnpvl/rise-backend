name: Deploy Rise Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

  deploy:
    name: Deploy to DigitalOcean
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: rise-backend-production-deploy
      cancel-in-progress: false

    steps:
      - name: Configure SSH
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$DROPLET_SSH_KEY" > ~/.ssh/rise_deploy_key
          chmod 600 ~/.ssh/rise_deploy_key

          ssh-keyscan -H "$DROPLET_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy on droplet
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/rise_deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DROPLET_USER@$DROPLET_HOST" 'bash -se' <<'EOF'
          set -euo pipefail

          cd /var/www/rise

          old_lock_hash=""
          if [ -f package-lock.json ]; then
            old_lock_hash="$(sha256sum package-lock.json | awk '{print $1}')"
          fi

          git pull --ff-only origin main

          new_lock_hash=""
          if [ -f package-lock.json ]; then
            new_lock_hash="$(sha256sum package-lock.json | awk '{print $1}')"
          fi

          if [ ! -d node_modules ] || [ "$old_lock_hash" != "$new_lock_hash" ]; then
            npm ci
          else
            echo "package-lock.json unchanged and node_modules present; skipping npm ci."
          fi

          npm run build
          pm2 restart rise --update-env
          EOF

      - name: Health check
        run: |
          set -euo pipefail

          url="https://api.serviciosmedicosrise.com/"

          for attempt in $(seq 1 10); do
            echo "Health check attempt ${attempt}/10..."

            headers="$(curl -sI "$url" || true)"
            status="$(printf '%s\n' "$headers" | awk '/^HTTP\// { code=$2 } END { print code }')"
            robots_header="$(printf '%s\n' "$headers" | awk 'BEGIN { IGNORECASE=1 } /^X-Robots-Tag:/ { sub(/\r$/, ""); sub(/^[^:]+:[[:space:]]*/, ""); print; exit }')"

            printf '%s\n' "$headers"

            if [ "$status" = "404" ] && [ "$robots_header" = "noindex, nofollow" ]; then
              echo "Health check passed."
              exit 0
            fi

            if [ "$attempt" -lt 10 ]; then
              echo "Expected HTTP 404 with X-Robots-Tag: noindex, nofollow; retrying in 3 seconds."
              sleep 3
            fi
          done

          echo "Health check failed after 10 attempts."
          exit 1
